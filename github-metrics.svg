<svg viewBox="0 0 900 200" width="900" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="g"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00b4d8" stop-opacity="1"/>
      <stop offset="80%" stop-color="#00b4d8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .g{stroke:#00b4d8;stroke-width:0.4;opacity:0.1;}
      .c{stroke:#00b4d8;stroke-width:2;fill:none;animation:cp 2.5s ease-in-out infinite;}
      @keyframes cp{0%,100%{stroke-opacity:1;}50%{stroke-opacity:0.25;}}
      .t{font-family:"Courier New",monospace;font-size:22px;font-weight:700;letter-spacing:4px;fill:#00b4d8;filter:url(#g);animation:tp 2s ease-in-out infinite;}
      @keyframes tp{0%,100%{fill:#00b4d8;opacity:1;}50%{fill:#00ff88;opacity:0.7;}}
      .s{font-family:"Courier New",monospace;font-size:11px;letter-spacing:3px;fill:#00ff88;opacity:0.65;}
      .h{font-family:"Courier New",monospace;font-size:9px;letter-spacing:1.5px;fill:#00b4d8;opacity:0.38;}
      .led{animation:lp 1.4s step-end infinite;}
      @keyframes lp{0%,100%{opacity:1;}50%{opacity:0.1;}}
      .scan{animation:sc 4s linear infinite;}
      @keyframes sc{0%{transform:translateY(-20px);}100%{transform:translateY(220px);}}
    </style>
  </defs>
  <rect width="900" height="200" fill="#07090f"/>
  <line class="g" x1="0" y1="50" x2="900" y2="50"/><line class="g" x1="0" y1="100" x2="900" y2="100"/><line class="g" x1="0" y1="150" x2="900" y2="150"/>
  <line class="g" x1="180" y1="0" x2="180" y2="200"/><line class="g" x1="360" y1="0" x2="360" y2="200"/><line class="g" x1="540" y1="0" x2="540" y2="200"/><line class="g" x1="720" y1="0" x2="720" y2="200"/>
  <rect class="scan" x="0" y="-20" width="900" height="14" fill="#00e5ff" opacity="0.04"/>
  <rect x="0" y="0" width="900" height="3" fill="url(#lg)"><animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/></rect>
  <rect x="0" y="197" width="900" height="3" fill="url(#lg)"><animate attributeName="opacity" values="1;0.35;1" dur="2s" begin="1s" repeatCount="indefinite"/></rect>
  <polyline class="c" points="12,32 12,12 32,12"/>
  <polyline class="c" points="888,32 888,12 868,12"/>
  <polyline class="c" points="12,168 12,188 32,188"/>
  <polyline class="c" points="888,168 888,188 868,188"/>
  <rect class="led" x="9" y="9" width="3" height="3" fill="#00ff88" rx="0.5"/>
  <rect class="led" x="888" y="9" width="3" height="3" fill="#00ff88" rx="0.5"><animate attributeName="opacity" values="1;0.1;1" dur="1.4s" begin="0.7s" repeatCount="indefinite"/></rect>
  <rect class="led" x="9" y="188" width="3" height="3" fill="#00ff88" rx="0.5"><animate attributeName="opacity" values="1;0.1;1" dur="1.4s" begin="0.35s" repeatCount="indefinite"/></rect>
  <rect class="led" x="888" y="188" width="3" height="3" fill="#00ff88" rx="0.5"><animate attributeName="opacity" values="1;0.1;1" dur="1.4s" begin="1.05s" repeatCount="indefinite"/></rect>
  <rect x="36" y="30" width="2" height="140" fill="#00ff88" rx="1"><animate attributeName="opacity" values="0.8;0.35;0.8" dur="3s" repeatCount="indefinite"/></rect>
  <rect x="862" y="30" width="2" height="140" fill="#00ff88" rx="1"><animate attributeName="opacity" values="0.8;0.35;0.8" dur="3s" begin="1.5s" repeatCount="indefinite"/></rect>
  <text x="55" y="28" class="s">[ INITIALIZING METRICS MODULE ]</text>
  <text x="680" y="28" class="s">STANDBY</text>
  <text x="450" y="108" class="t" text-anchor="middle">GENERATING METRICS...</text>
  <text x="450" y="138" style="font-family:Courier New,monospace;font-size:12px;letter-spacing:3px;fill:#00b4d8;opacity:0.6;" text-anchor="middle">Run the &quot;GitHub Metrics&quot; workflow in Actions tab</text>
  <text x="55" y="180" class="h">0xMETRICS >> AWAITING_FIRST_RUN</text>
  <text x="680" y="180" class="h">STATUS: PENDING</text>
</svg>
